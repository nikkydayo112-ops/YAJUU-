<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先輩</title>
    <style>
        /* 画面全体の設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* 背景を真っ白に */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 画像の設定 */
        img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* ほんのり影をつけて見やすく */
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- 貼り付けた画像（インターネット上のリンク） -->
    <img src="https://wsj.net" alt="先輩">

</body>
</html>
